[platformio]
default_envs = supermini

[env:supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit LSM6DS@^4.7.3
    h2zero/NimBLE-Arduino@^2.1.0

; Unit tests for the freeze index on a computer:  pio test -e native
[env:native]
platform = native
test_build_src = no
lib_compat_mode = off
